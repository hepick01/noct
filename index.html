<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>noct — 지금 이 도시의 음악</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#03030a;font-family:'Noto Sans KR',-apple-system,sans-serif;overflow:hidden;}
#map{position:fixed;inset:0;width:100%;height:100%;}

#vibestrip{position:fixed;top:0;left:0;right:0;z-index:200;height:2px;
  background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c77dff,#ff6b6b);
  background-size:200% 100%;animation:rainbowSlide 6s linear infinite;}
@keyframes rainbowSlide{0%{background-position:0%}100%{background-position:200%}}

#topbar{position:fixed;top:2px;left:0;right:0;z-index:100;
  padding:16px 22px 20px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(3,3,10,0.96) 60%,transparent);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,#c77dff,#7B68EE);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#fff;box-shadow:0 0 16px #c77dff55;}
.logo-text{color:#fff;font-size:18px;font-weight:700;letter-spacing:-0.3px;}
.logo-sub{color:rgba(255,255,255,0.35);font-size:11px;font-weight:300;margin-top:1px;}
.city-tabs{display:flex;background:rgba(255,255,255,0.05);border-radius:22px;padding:3px;gap:2px;border:1px solid rgba(255,255,255,0.08);}
.tab{border-radius:18px;padding:5px 16px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all 0.25s;color:rgba(255,255,255,0.35);background:transparent;font-family:inherit;}
.tab.active{background:linear-gradient(135deg,#c77dff,#7B68EE);color:#fff;box-shadow:0 2px 12px #c77dff44;}
.tab.inactive:hover{color:rgba(255,255,255,0.7);}

#vibebadge{position:fixed;top:75px;left:22px;z-index:100;display:flex;align-items:center;gap:8px;}
.vibe-tag{background:rgba(199,125,255,0.12);border:1px solid rgba(199,125,255,0.28);border-radius:20px;padding:5px 13px;color:#c77dff;font-size:11px;font-weight:500;}
.vibe-time{color:rgba(255,255,255,0.25);font-size:11px;}

#livebadge{position:fixed;bottom:100px;left:22px;z-index:100;
  background:rgba(3,3,10,0.82);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:13px 18px;
  display:flex;flex-direction:column;gap:5px;}
.live-row{display:flex;align-items:center;gap:8px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#c77dff;flex-shrink:0;
  box-shadow:0 0 8px #c77dff;animation:dotPulse 2s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{opacity:1;box-shadow:0 0 8px #c77dff}50%{opacity:0.5;box-shadow:0 0 16px #c77dff}}
.live-main{color:rgba(255,255,255,0.9);font-size:13px;font-weight:500;}
.live-count{color:#c77dff;font-weight:700;}
.live-sub{color:rgba(255,255,255,0.22);font-size:11px;padding-left:15px;}

/* ════ 검색 모달 ════ */
#searchOverlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(3,3,10,0.85);backdrop-filter:blur(20px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.25s;
}
#searchOverlay.open{opacity:1;pointer-events:all;}

#searchSheet{
  width:100%;max-width:560px;
  background:rgba(10,8,24,0.98);
  border-radius:24px 24px 0 0;
  border:1px solid rgba(255,255,255,0.08);
  border-bottom:none;
  padding:24px 22px 40px;
  transform:translateY(100%);
  transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
}
#searchOverlay.open #searchSheet{transform:translateY(0);}

.sheet-handle{width:40px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:0 auto 22px;}
.sheet-title{color:#fff;font-size:17px;font-weight:700;margin-bottom:16px;letter-spacing:-0.3px;}

/* 검색 입력 */
.search-input-wrap{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:12px 16px;
  margin-bottom:16px;transition:border-color 0.2s;
}
.search-input-wrap:focus-within{border-color:rgba(199,125,255,0.5);}
.search-icon{color:rgba(255,255,255,0.3);font-size:16px;flex-shrink:0;}
#searchInput{
  flex:1;background:none;border:none;outline:none;
  color:#fff;font-size:15px;font-family:inherit;
}
#searchInput::placeholder{color:rgba(255,255,255,0.25);}
#searchClear{background:none;border:none;color:rgba(255,255,255,0.25);cursor:pointer;font-size:18px;padding:0;display:none;}

/* 검색 결과 */
#searchResults{
  max-height:340px;overflow-y:auto;
  display:flex;flex-direction:column;gap:4px;
}
#searchResults::-webkit-scrollbar{width:3px;}
#searchResults::-webkit-scrollbar-track{background:transparent;}
#searchResults::-webkit-scrollbar-thumb{background:rgba(199,125,255,0.3);border-radius:2px;}

.result-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:12px;cursor:pointer;
  transition:background 0.15s;border:1px solid transparent;
}
.result-item:hover{background:rgba(199,125,255,0.08);border-color:rgba(199,125,255,0.15);}
.result-thumb{
  width:46px;height:46px;border-radius:8px;object-fit:cover;flex-shrink:0;
  background:rgba(255,255,255,0.05);
}
.result-info{flex:1;min-width:0;}
.result-title{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.result-channel{color:rgba(255,255,255,0.35);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.result-duration{color:rgba(255,255,255,0.25);font-size:11px;flex-shrink:0;}

.search-loading{text-align:center;padding:30px 0;color:rgba(255,255,255,0.3);font-size:13px;}
.search-empty{text-align:center;padding:30px 0;color:rgba(255,255,255,0.25);font-size:13px;}

/* 인기 검색어 */
.quick-title{color:rgba(255,255,255,0.3);font-size:11px;font-weight:500;margin-bottom:10px;letter-spacing:0.03em;}
.quick-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.quick-tag{
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;padding:6px 13px;
  color:rgba(255,255,255,0.5);font-size:12px;cursor:pointer;
  transition:all 0.15s;font-family:inherit;
}
.quick-tag:hover{background:rgba(199,125,255,0.1);border-color:rgba(199,125,255,0.3);color:#c77dff;}

/* ════ 미니 플레이어 ════ */
#miniPlayer{
  position:fixed;bottom:0;left:0;right:0;z-index:500;
  background:rgba(6,4,16,0.97);backdrop-filter:blur(30px);
  border-top:1px solid rgba(255,255,255,0.07);
  padding:12px 20px 28px;
  transform:translateY(100%);
  transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
}
#miniPlayer.open{transform:translateY(0);}

.player-inner{display:flex;align-items:center;gap:14px;}
.player-thumb{
  width:44px;height:44px;border-radius:10px;object-fit:cover;
  background:rgba(199,125,255,0.1);flex-shrink:0;
  border:1px solid rgba(199,125,255,0.2);
}
.player-info{flex:1;min-width:0;}
.player-title{color:#fff;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.player-channel{color:rgba(255,255,255,0.35);font-size:11px;}
.player-controls{display:flex;align-items:center;gap:4px;}
.ctrl-btn{
  background:none;border:none;cursor:pointer;
  color:rgba(255,255,255,0.6);font-size:18px;
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.15s,color 0.15s;font-family:inherit;
}
.ctrl-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
.ctrl-btn.play-btn{
  background:linear-gradient(135deg,#c77dff,#7B68EE);
  color:#fff;width:40px;height:40px;font-size:16px;
  box-shadow:0 4px 16px #c77dff44;
}
.ctrl-btn.play-btn:hover{box-shadow:0 6px 22px #c77dff66;}

/* 공유하기 버튼 */
.share-btn{
  background:rgba(199,125,255,0.12);border:1px solid rgba(199,125,255,0.25);
  border-radius:20px;padding:5px 13px;cursor:pointer;
  color:#c77dff;font-size:11px;font-weight:600;
  transition:all 0.15s;white-space:nowrap;font-family:inherit;
}
.share-btn:hover{background:rgba(199,125,255,0.2);}

/* 메인 버튼 */
#mainBtn{
  position:fixed;bottom:100px;right:22px;z-index:100;
  background:linear-gradient(135deg,#c77dff,#7B68EE);
  border:none;border-radius:16px;padding:13px 20px;cursor:pointer;
  display:flex;align-items:center;gap:9px;
  font-size:14px;font-weight:700;color:white;
  font-family:inherit;box-shadow:0 6px 24px #c77dff44;
  transition:transform 0.15s,box-shadow 0.15s;
}
#mainBtn:hover{transform:translateY(-2px);box-shadow:0 10px 32px #c77dff55;}

/* 곡 카드 */
#songcard{position:fixed;bottom:180px;left:22px;z-index:200;
  background:rgba(8,6,18,0.94);backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);border-radius:20px;
  padding:0;width:280px;opacity:0;transform:translateY(12px) scale(0.97);
  transition:opacity 0.22s,transform 0.22s;pointer-events:none;overflow:hidden;}
#songcard.visible{opacity:1;transform:translateY(0) scale(1);pointer-events:all;}
.card-header{padding:16px 18px 12px;display:flex;align-items:flex-start;gap:12px;}
.card-albumart{width:52px;height:52px;border-radius:10px;flex-shrink:0;object-fit:cover;background:rgba(255,255,255,0.05);}
.card-track{color:#fff;font-size:13px;font-weight:700;line-height:1.35;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-artist{color:rgba(255,255,255,0.4);font-size:11px;font-weight:300;}
.card-divider{height:1px;background:rgba(255,255,255,0.05);margin:0 18px;}
.card-moodbox{padding:11px 18px;}
.mood-label{color:rgba(255,255,255,0.25);font-size:10px;font-weight:500;letter-spacing:0.05em;margin-bottom:6px;}
.card-moods{display:flex;flex-wrap:wrap;gap:4px;}
.mood-tag{border-radius:20px;padding:3px 10px;font-size:10px;font-weight:500;}
.card-footer{padding:10px 18px 14px;display:flex;align-items:center;justify-content:space-between;}
.footer-loc{display:flex;align-items:center;gap:5px;}
.footer-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.footer-text{color:rgba(255,255,255,0.22);font-size:11px;}
.footer-ago{color:rgba(255,255,255,0.15);font-size:11px;}
.card-close{position:absolute;top:11px;right:11px;background:rgba(255,255,255,0.06);border:none;border-radius:50%;width:24px;height:24px;color:rgba(255,255,255,0.35);cursor:pointer;font-size:14px;line-height:24px;text-align:center;font-family:inherit;}

/* 토스트 */
#toast{position:fixed;top:65px;left:50%;z-index:300;
  transform:translateX(-50%) translateY(-10px);
  background:rgba(8,6,18,0.92);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.07);border-radius:30px;padding:9px 18px;
  display:flex;align-items:center;gap:9px;white-space:nowrap;opacity:0;
  transition:opacity 0.25s,transform 0.25s;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast-pill{background:rgba(199,125,255,0.15);border:1px solid rgba(199,125,255,0.3);border-radius:20px;padding:2px 9px;color:#c77dff;font-size:10px;font-weight:500;}

/* 음악 마커 */
.noct-marker{position:relative;width:18px;height:18px;cursor:pointer;}
.noct-marker .m-ring{position:absolute;inset:-6px;border-radius:50%;border:1.5px solid;opacity:0;animation:ringOut 2.8s ease-out infinite;}
.noct-marker .m-ring2{position:absolute;inset:-2px;border-radius:50%;opacity:0.15;animation:glowBreath 2.8s ease-in-out infinite;}
.noct-marker .m-core{position:absolute;inset:3px;border-radius:50%;transition:transform 0.18s;}
.noct-marker .m-shine{position:absolute;inset:6px;border-radius:50%;background:rgba(255,255,255,0.85);}
.noct-marker:hover .m-core{transform:scale(1.5);}
@keyframes ringOut{0%{transform:scale(0.6);opacity:0.8}100%{transform:scale(2.6);opacity:0}}
@keyframes glowBreath{0%,100%{opacity:0.15}50%{opacity:0.3}}

/* 내 마커 (특별) */
.my-marker{position:relative;width:22px;height:22px;cursor:pointer;}
.my-marker .m-ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid #c77dff;opacity:0;animation:ringOut 2s ease-out infinite;}
.my-marker .m-core{position:absolute;inset:2px;border-radius:50%;background:linear-gradient(135deg,#c77dff,#7B68EE);box-shadow:0 0 16px #c77dff99;}
.my-marker .m-shine{position:absolute;inset:7px;border-radius:50%;background:rgba(255,255,255,0.9);}
.my-marker-label{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#c77dff,#7B68EE);border-radius:8px;padding:2px 8px;color:#fff;font-size:10px;font-weight:700;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;}

/* 광고 빌보드 */
.ad-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;filter:drop-shadow(0 12px 32px rgba(0,0,0,0.8));animation:bbFloat 3.5s ease-in-out infinite;}
@keyframes bbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bb-card{background:rgba(6,4,16,0.96);border-radius:14px;padding:10px 15px 10px 11px;display:flex;align-items:center;gap:10px;border:1px solid;position:relative;overflow:hidden;min-width:155px;transition:transform 0.2s;white-space:nowrap;}
.bb-card:hover{transform:scale(1.07);}
.bb-card::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent);animation:bbShine 3.5s ease-in-out infinite;}
@keyframes bbShine{0%,60%,100%{left:-60%}40%{left:130%}}
.bb-adtag{position:absolute;top:-9px;right:10px;background:linear-gradient(135deg,#c77dff,#7B68EE);border-radius:8px;padding:2px 8px;color:#fff;font-size:9px;font-weight:700;font-family:'Noto Sans KR',sans-serif;}
.bb-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.bb-name{color:#fff;font-size:12px;font-weight:700;margin-bottom:1px;font-family:'Noto Sans KR',sans-serif;}
.bb-sub{color:rgba(255,255,255,0.35);font-size:10px;font-family:'Noto Sans KR',sans-serif;}
.bb-line{width:2px;height:24px;}
.bb-anchor{width:8px;height:8px;border-radius:50%;margin-top:-1px;}

/* 광고 카드 */
#adcard{position:fixed;bottom:180px;right:22px;z-index:200;background:rgba(8,6,18,0.96);backdrop-filter:blur(30px);border-radius:22px;padding:0;width:290px;opacity:0;transform:translateY(12px) scale(0.97);transition:opacity 0.22s,transform 0.22s;pointer-events:none;overflow:hidden;}
#adcard.visible{opacity:1;transform:translateY(0) scale(1);pointer-events:all;}
.adc-hero{height:100px;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;}
.adc-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(to bottom,transparent,rgba(8,6,18,0.96));}
.adc-body{padding:12px 18px 18px;}
.adc-spon{display:inline-flex;align-items:center;gap:5px;background:rgba(199,125,255,0.1);border:1px solid rgba(199,125,255,0.22);border-radius:20px;padding:3px 10px;color:#c77dff;font-size:10px;font-weight:500;margin-bottom:10px;}
.adc-title{color:#fff;font-size:16px;font-weight:700;margin-bottom:5px;line-height:1.4;white-space:pre-line;}
.adc-desc{color:rgba(255,255,255,0.38);font-size:12px;margin-bottom:14px;line-height:1.7;white-space:pre-line;}
.adc-cta{display:block;width:100%;padding:12px;border-radius:12px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:transform 0.15s;}
.adc-cta:hover{transform:translateY(-1px);}
.adc-stats{display:flex;margin-top:12px;border-top:1px solid rgba(255,255,255,0.05);padding-top:12px;}
.stat-item{flex:1;text-align:center;}
.stat-num{color:#fff;font-size:14px;font-weight:700;}
.stat-label{color:rgba(255,255,255,0.22);font-size:10px;margin-top:2px;}
.adc-close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.35);border:none;border-radius:50%;width:28px;height:28px;color:rgba(255,255,255,0.55);cursor:pointer;font-size:16px;line-height:28px;text-align:center;font-family:inherit;}

/* 유튜브 플레이어 (숨김) */
#ytPlayer{position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;}

.mapboxgl-ctrl-bottom-right,.mapboxgl-ctrl-bottom-left,.mapboxgl-ctrl-logo,.mapboxgl-ctrl-attrib{display:none!important}
</style>
</head>
<body>
<div id="vibestrip"></div>
<div id="map"></div>
<div id="ytPlayer"></div>

<div id="topbar">
  <div class="logo">
    <div class="logo-icon">N</div>
    <div>
      <div class="logo-text">noct</div>
      <div class="logo-sub">지금 이 도시의 음악</div>
    </div>
  </div>
  <div class="city-tabs">
    <button class="tab active" data-city="busan" onclick="flyTo('busan',this)">부산</button>
    <button class="tab inactive" data-city="seoul" onclick="flyTo('seoul',this)">서울</button>
  </div>
</div>

<div id="vibebadge">
  <span class="vibe-tag" id="vibeTag">새벽 감성 🌙</span>
  <span class="vibe-time" id="vibeTime"></span>
</div>

<div id="livebadge">
  <div class="live-row">
    <div class="live-dot"></div>
    <span class="live-main">지금 <span id="cityname">부산</span>에서 <span class="live-count" id="livenum">183</span>명</span>
  </div>
  <div class="live-sub">실시간으로 음악 듣는 중 · 20초마다 갱신</div>
</div>

<!-- 내 음악 올리기 버튼 -->
<button id="mainBtn" onclick="openSearch()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
  내 음악 올리기
</button>

<!-- 검색 모달 -->
<div id="searchOverlay" onclick="handleOverlayClick(event)">
  <div id="searchSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">🎵 지금 듣고 싶은 곡을 검색하세요</div>

    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="아이유, BTS, NewJeans, Frank Ocean..."
        oninput="handleSearchInput()" onkeydown="if(event.key==='Enter')doSearch()">
      <button id="searchClear" onclick="clearSearch()">×</button>
    </div>

    <div id="quickSection">
      <div class="quick-title">⚡ 인기 검색어</div>
      <div class="quick-tags">
        <button class="quick-tag" onclick="setSearch('아이유 밤편지')">아이유 밤편지</button>
        <button class="quick-tag" onclick="setSearch('NewJeans Attention')">NewJeans Attention</button>
        <button class="quick-tag" onclick="setSearch('BTS 봄날')">BTS 봄날</button>
        <button class="quick-tag" onclick="setSearch('Hyukoh 오래된 노래')">혁오 오래된 노래</button>
        <button class="quick-tag" onclick="setSearch('Frank Ocean Ivy')">Frank Ocean Ivy</button>
        <button class="quick-tag" onclick="setSearch('The Weeknd Blinding Lights')">The Weeknd</button>
        <button class="quick-tag" onclick="setSearch('Epik High 낙화')">에픽하이 낙화</button>
        <button class="quick-tag" onclick="setSearch('IVE LOVE DIVE')">IVE LOVE DIVE</button>
      </div>
    </div>

function spawnMarkers(k){

  CITIES[k].spots.forEach(spot=>{

// ══ 검색 ══
function openSearch(){
  document.getElementById('searchOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('searchInput').focus(),400);
}
function closeSearch(){document.getElementById('searchOverlay').classList.remove('open');}
function handleOverlayClick(e){if(e.target===document.getElementById('searchOverlay'))closeSearch();}

function setSearch(q){
  document.getElementById('searchInput').value=q;
  doSearch();
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').style.display='none';
  document.getElementById('searchResults').innerHTML='';
  document.getElementById('quickSection').style.display='block';
}
function handleSearchInput(){
  const v=document.getElementById('searchInput').value;
  document.getElementById('searchClear').style.display=v?'block':'none';
  document.getElementById('quickSection').style.display=v?'none':'block';
  clearTimeout(searchTimer);
  if(v.length>1) searchTimer=setTimeout(doSearch,500);
  else document.getElementById('searchResults').innerHTML='';
}

async function doSearch(){
  const q=document.getElementById('searchInput').value.trim();
  if(!q) return;
  document.getElementById('quickSection').style.display='none';
  const res=document.getElementById('searchResults');
  res.innerHTML='<div class="search-loading">🔍 검색 중...</div>';

  // YouTube API 키가 없으면 샘플 결과 표시
  if(YT_API_KEY==='YOUR_YOUTUBE_API_KEY_HERE'){
    showSampleResults(q);return;
  }

  try{
    const url=`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q+" official audio")}&type=video&videoCategoryId=10&maxResults=8&key=${YT_API_KEY}`;
    const data=await fetch(url).then(r=>r.json());
    if(!data.items||data.items.length===0){res.innerHTML='<div class="search-empty">검색 결과가 없어요 😢</div>';return;}
    res.innerHTML=data.items.map(item=>`
      <div class="result-item" onclick="selectSong('${item.id.videoId}','${escHtml(item.snippet.title)}','${escHtml(item.snippet.channelTitle)}','${item.snippet.thumbnails.medium.url}')">
        <img class="result-thumb" src="${item.snippet.thumbnails.default.url}" alt="">
        <div class="result-info">
          <div class="result-title">${item.snippet.title}</div>
          <div class="result-channel">${item.snippet.channelTitle}</div>
        </div>
      </div>`).join('');
  }catch(e){showSampleResults(q);}
}

  if(thumb) document.getElementById('playerThumb').src=thumb;
  document.getElementById('miniPlayer').classList.add('open');
  document.getElementById('livebadge').style.bottom='168px';
  document.getElementById('mainBtn').style.bottom='168px';

  // 유튜브 재생
  if(ytReady&&ytPlayer){
    ytPlayer.loadVideoById(videoId);
    ytPlayer.playVideo();
    isPlaying=true;
    document.getElementById('playBtn').textContent='⏸';
  }

  // 내 마커 지도에 표시
  placeMyMarker(title, thumb);

  showToastMsg('📍 내 음악이 지도에 표시됐어요!');
}

function placeMyMarker(title, thumb){
  if(myMarker){myMarker.remove();myMarker=null;}
  const city=CITIES[currentCity];
  const lng=city.center[0]+(Math.random()-0.5)*0.006;
  const lat=city.center[1]+(Math.random()-0.5)*0.004;

  const el=document.createElement('div');
  el.className='my-marker';
  el.innerHTML=`
    <div class="my-marker-label">나</div>
    <div class="m-ring"></div>
    <div class="m-core"></div>
    <div class="m-shine"></div>`;

  el.addEventListener('click',e=>{
    e.stopPropagation();
    // 내 카드 표시
    document.getElementById('cardtrack').textContent=currentSong.title;
    document.getElementById('cardartist').textContent=currentSong.channel;
    document.getElementById('cardfooter').textContent='내 위치';
    document.getElementById('footerdot').style.background='#c77dff';
    if(currentSong.thumb) document.getElementById('cardcover').src=currentSong.thumb;
    document.getElementById('cardmoods').innerHTML='<span class="mood-tag" style="background:#c77dff18;border:1px solid #c77dff30;color:#c77dff">지금 듣는 중 🎵</span>';
    document.getElementById('songcard').classList.add('visible');
  });

  myMarker=new mapboxgl.Marker({element:el,anchor:'center'}).setLngLat([lng,lat]).addTo(map);
  map.flyTo({center:[lng,lat],zoom:15,duration:1200});
}

function togglePlay(){
  if(!ytReady||!ytPlayer||!currentSong) return;
  if(isPlaying){ytPlayer.pauseVideo();}
  else{ytPlayer.playVideo();}
}

function stopAndClear(){
  if(ytPlayer) ytPlayer.stopVideo();
  isPlaying=false;
  currentSong=null;
  if(myMarker){myMarker.remove();myMarker=null;}
  document.getElementById('miniPlayer').classList.remove('open');
  document.getElementById('livebadge').style.bottom='100px';
  document.getElementById('mainBtn').style.bottom='100px';
}

function shareNow(){
  if(!currentSong) return;
  const text=`🎵 noct에서 "${currentSong.title}" 듣는 중\n지금 이 도시의 음악을 지도에서 확인하세요 👉 hepick01.github.io/noct`;
  if(navigator.share){navigator.share({title:'noct',text});}
  else{navigator.clipboard.writeText(text).then(()=>showToastMsg('📋 공유 텍스트가 복사됐어요!'));}
}

// ══ 카드들 ══
function showFakeCard(s,district){
  document.getElementById('cardtrack').textContent=s.title;
  document.getElementById('cardartist').textContent=s.channel;
  document.getElementById('cardfooter').textContent=district;
  document.getElementById('footerdot').style.background=s.color;
  document.getElementById('cardcover').src='';
  document.getElementById('cardcover').style.background=s.color+'22';
  document.getElementById('cardmoods').innerHTML=s.mood.map(m=>`<span class="mood-tag" style="background:${s.color}14;border:1px solid ${s.color}30;color:${s.color}">${m}</span>`).join('');
  document.getElementById('songcard').style.borderColor=s.color+'22';
  document.getElementById('songcard').classList.add('visible');
}
function closeCard(){document.getElementById('songcard').classList.remove('visible');}

function showAdCard(ad){
  document.getElementById('adhero').style.background=`linear-gradient(135deg,${ad.color}33,${ad.color}11)`;
  document.getElementById('adhero').textContent=ad.icon;
  document.getElementById('adcard').style.borderColor=ad.color+'33';
  document.getElementById('adtitle').textContent=ad.title;
  document.getElementById('adsub').textContent=ad.desc;
  const cta=document.getElementById('adcta');
  cta.textContent=ad.cta;cta.style.background=`linear-gradient(135deg,${ad.color},${ad.color}cc)`;
  const light=['#FFCC00','#FFCD00','#FFA500'];
  cta.style.color=light.includes(ad.color)?'#111':'#fff';
  cta.style.boxShadow=`0 4px 18px ${ad.color}44`;
  ['1','2','3'].forEach((i,idx)=>{
    document.getElementById('s'+i+'n').textContent=ad.stats[idx].n;
    document.getElementById('s'+i+'l').textContent=ad.stats[idx].l;
  });
  document.getElementById('adcard').classList.add('visible');
}
function closeAdCard(){document.getElementById('adcard').classList.remove('visible');}

map.on('click',()=>{closeCard();closeAdCard();});

function flyTo(k,el){
  document.querySelectorAll('.tab').forEach(t=>{t.className='tab '+(t.dataset.city===k?'active':'inactive');});
  currentCity=k;
  const city=CITIES[k];
  document.getElementById('cityname').textContent=city.name;
  document.getElementById('livenum').textContent=city.count;
  map.flyTo({center:city.center,zoom:city.zoom,pitch:city.pitch,bearing:city.bearing,duration:2400,essential:true});
  setTimeout(()=>{spawnMarkers(k);spawnAdLayer(k);spawnAdMarkers(k);},1500);
}

function showToastMsg(msg){
  const t=document.getElementById('toast');
  document.getElementById('ttrack').textContent=msg;
  document.getElementById('tartist').textContent='';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);
}
setInterval(()=>{
  const s=FAKE_SONGS[Math.floor(Math.random()*FAKE_SONGS.length)];
  document.getElementById('ttrack').textContent=s.title;
  document.getElementById('tartist').textContent='— '+s.channel;
  document.getElementById('toast').classList.add('show');
  setTimeout(()=>document.getElementById('toast').classList.remove('show'),3200);
},7000);
setInterval(()=>{const b=CITIES[currentCity].count;document.getElementById('livenum').textContent=b+Math.floor((Math.random()-0.5)*8);},9000);
</script>
