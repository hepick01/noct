<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>noct — 지금 이 도시의 음악</title>
<meta name="description" content="지금 이 도시 사람들이 듣고 있는 음악을 3D 지도 위에서 확인하세요">
<meta property="og:title" content="noct — 지금 이 도시의 음악">
<meta property="og:description" content="지금 부산/서울에서 실시간으로 음악 듣는 중 🎵">
<meta property="og:url" content="https://hepick01.github.io/noct">
<meta property="og:type" content="website">
<meta name="theme-color" content="#c77dff">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#03030a;font-family:"Noto Sans KR",-apple-system,sans-serif;overflow:hidden;height:100dvh;}
#map{position:fixed;inset:0;width:100%;height:100%;}

/* 상단 무지개 라인 */
#vibestrip{position:fixed;top:0;left:0;right:0;z-index:200;height:2px;
  background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c77dff,#ff6b6b);
  background-size:200% 100%;animation:rainbowSlide 6s linear infinite;}
@keyframes rainbowSlide{0%{background-position:0%}100%{background-position:200%}}

/* 상단바 */
#topbar{position:fixed;top:2px;left:0;right:0;z-index:100;
  padding:12px 16px 16px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(3,3,10,0.96) 60%,transparent);}
.logo{display:flex;align-items:center;gap:8px;}
.logo-icon{width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,#c77dff,#7B68EE);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;box-shadow:0 0 12px #c77dff55;}
.logo-text{color:#fff;font-size:17px;font-weight:700;letter-spacing:-0.3px;}
.logo-sub{color:rgba(255,255,255,0.35);font-size:10px;font-weight:300;margin-top:1px;}
.city-tabs{display:flex;background:rgba(255,255,255,0.05);border-radius:20px;padding:3px;gap:2px;border:1px solid rgba(255,255,255,0.08);}
.tab{border-radius:16px;padding:5px 14px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all 0.25s;color:rgba(255,255,255,0.35);background:transparent;font-family:inherit;}
.tab.active{background:linear-gradient(135deg,#c77dff,#7B68EE);color:#fff;box-shadow:0 2px 10px #c77dff44;}
.tab.inactive:hover{color:rgba(255,255,255,0.7);}

/* 감성 뱃지 */
#vibebadge{position:fixed;top:68px;left:16px;z-index:100;display:flex;align-items:center;gap:7px;}
.vibe-tag{background:rgba(199,125,255,0.12);border:1px solid rgba(199,125,255,0.28);border-radius:20px;padding:4px 11px;color:#c77dff;font-size:11px;font-weight:500;}
.vibe-time{color:rgba(255,255,255,0.25);font-size:11px;}

/* 라이브 뱃지 */
#livebadge{position:fixed;bottom:100px;left:16px;z-index:100;
  background:rgba(3,3,10,0.82);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:10px 14px;
  display:flex;flex-direction:column;gap:4px;}
.live-row{display:flex;align-items:center;gap:7px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#c77dff;flex-shrink:0;
  box-shadow:0 0 8px #c77dff;animation:dotPulse 2s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{opacity:1;box-shadow:0 0 8px #c77dff}50%{opacity:0.5;box-shadow:0 0 16px #c77dff}}
.live-main{color:rgba(255,255,255,0.9);font-size:12px;font-weight:500;}
.live-count{color:#c77dff;font-weight:700;}
.live-sub{color:rgba(255,255,255,0.22);font-size:10px;padding-left:13px;}

/* 버튼들 */
#mainBtn{position:fixed;bottom:100px;right:16px;z-index:100;
  background:linear-gradient(135deg,#c77dff,#7B68EE);
  border:none;border-radius:14px;padding:12px 18px;cursor:pointer;
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;color:white;font-family:inherit;
  box-shadow:0 6px 24px #c77dff44;transition:transform 0.15s;}
#mainBtn:active{transform:scale(0.96);}

/* 내 위치로 이동 버튼 */
#myLocBtn{position:fixed;bottom:100px;right:16px;z-index:100;
  background:linear-gradient(135deg,rgba(199,125,255,0.2),rgba(123,104,238,0.2));
  backdrop-filter:blur(16px);
  border:1.5px solid rgba(199,125,255,0.6);border-radius:14px;padding:11px 16px;cursor:pointer;
  display:none;align-items:center;gap:7px;
  font-size:13px;font-weight:700;color:#fff;font-family:inherit;
  box-shadow:0 4px 20px rgba(199,125,255,0.35);
  transition:transform 0.15s;animation:myBtnPulse 2s ease-in-out infinite;}
#myLocBtn:active{transform:scale(0.96);}
@keyframes myBtnPulse{0%,100%{box-shadow:0 4px 20px rgba(199,125,255,0.35)}50%{box-shadow:0 4px 28px rgba(199,125,255,0.6)}}

/* TOP5 버튼 */
#topBtn{position:fixed;top:68px;right:16px;z-index:101;
  background:rgba(6,4,16,0.88);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.07);border-radius:12px;
  padding:7px 12px;cursor:pointer;color:rgba(255,255,255,0.6);
  font-size:11px;font-weight:500;font-family:inherit;
  display:flex;align-items:center;gap:5px;}
#topBtn:active{background:rgba(199,125,255,0.1);}

/* TOP5 패널 */
#topPanel{position:fixed;top:105px;right:16px;z-index:100;width:210px;
  background:rgba(6,4,16,0.95);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:14px;
  opacity:0;transform:translateY(-8px);pointer-events:none;
  transition:opacity 0.25s,transform 0.25s;}
#topPanel.visible{opacity:1;transform:translateY(0);pointer-events:all;}
.top-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.top-title{color:rgba(255,255,255,0.4);font-size:10px;font-weight:500;letter-spacing:0.05em;}
.top-close{background:none;border:none;color:rgba(255,255,255,0.25);cursor:pointer;font-size:16px;font-family:inherit;padding:0;}
.top-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.top-item:last-child{border-bottom:none;}
.top-rank{color:#c77dff;font-size:11px;font-weight:700;width:14px;flex-shrink:0;}
.top-info{flex:1;min-width:0;}
.top-track{color:#fff;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-artist{color:rgba(255,255,255,0.3);font-size:10px;}

/* 검색 오버레이 */
#searchOverlay{position:fixed;inset:0;z-index:1000;
  background:rgba(3,3,10,0.85);backdrop-filter:blur(20px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.25s;}
#searchOverlay.open{opacity:1;pointer-events:all;}
#searchSheet{width:100%;max-width:560px;
  background:rgba(10,8,24,0.99);border-radius:20px 20px 0 0;
  border:1px solid rgba(255,255,255,0.08);border-bottom:none;
  padding:20px 16px 40px;
  transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
  max-height:85dvh;display:flex;flex-direction:column;}
#searchOverlay.open #searchSheet{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:0 auto 18px;flex-shrink:0;}
.sheet-title{color:#fff;font-size:16px;font-weight:700;margin-bottom:14px;flex-shrink:0;}
.search-input-wrap{display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:11px 14px;margin-bottom:14px;flex-shrink:0;
  transition:border-color 0.2s;}
.search-input-wrap:focus-within{border-color:rgba(199,125,255,0.5);}
#searchInput{flex:1;background:none;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit;}
#searchInput::placeholder{color:rgba(255,255,255,0.25);}
#searchClear{background:none;border:none;color:rgba(255,255,255,0.25);cursor:pointer;font-size:18px;padding:0;display:none;font-family:inherit;}
#searchResults{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;}
#searchResults::-webkit-scrollbar{display:none;}
.quick-title{color:rgba(255,255,255,0.3);font-size:11px;font-weight:500;margin-bottom:9px;letter-spacing:0.03em;}
.quick-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.quick-tag{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;padding:6px 13px;color:rgba(255,255,255,0.5);font-size:12px;cursor:pointer;
  transition:all 0.15s;font-family:inherit;}
.quick-tag:active{background:rgba(199,125,255,0.15);border-color:rgba(199,125,255,0.3);color:#c77dff;}
.result-item{display:flex;align-items:center;gap:11px;padding:10px;border-radius:11px;cursor:pointer;
  transition:background 0.15s;min-height:56px;}
.result-item:active{background:rgba(199,125,255,0.08);}
.result-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,0.05);}
.result-info{flex:1;min-width:0;}
.result-title{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.result-channel{color:rgba(255,255,255,0.35);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.search-loading{text-align:center;padding:30px 0;color:rgba(255,255,255,0.3);font-size:13px;}

/* 미니 플레이어 */
#miniPlayer{position:fixed;bottom:0;left:0;right:0;z-index:500;
  background:rgba(6,4,16,0.97);backdrop-filter:blur(30px);
  border-top:1px solid rgba(255,255,255,0.07);
  padding:12px 16px 28px;
  transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);}
#miniPlayer.open{transform:translateY(0);}
.player-inner{display:flex;align-items:center;gap:12px;}
.player-thumb{width:42px;height:42px;border-radius:9px;object-fit:cover;
  background:rgba(199,125,255,0.1);flex-shrink:0;border:1px solid rgba(199,125,255,0.2);}
.player-info{flex:1;min-width:0;}
.player-title{color:#fff;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.player-channel{color:rgba(255,255,255,0.35);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-controls{display:flex;align-items:center;gap:4px;}
.ctrl-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.6);
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:background 0.15s;font-family:inherit;}
.ctrl-btn:active{background:rgba(255,255,255,0.1);}
.ctrl-btn.play-btn{background:linear-gradient(135deg,#c77dff,#7B68EE);color:#fff;
  width:40px;height:40px;font-size:15px;box-shadow:0 4px 14px #c77dff44;}
.share-btn{background:rgba(199,125,255,0.12);border:1px solid rgba(199,125,255,0.25);
  border-radius:18px;padding:6px 12px;cursor:pointer;
  color:#c77dff;font-size:11px;font-weight:600;white-space:nowrap;font-family:inherit;}
.share-btn:active{background:rgba(199,125,255,0.2);}

/* 곡 카드 */
#songcard{position:fixed;bottom:90px;left:16px;z-index:200;
  background:rgba(8,6,18,0.94);backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,0.08);border-radius:18px;
  width:calc(100vw - 32px);max-width:290px;
  opacity:0;transform:translateY(10px) scale(0.97);
  transition:opacity 0.22s,transform 0.22s;pointer-events:none;overflow:hidden;}
#songcard.visible{opacity:1;transform:translateY(0) scale(1);pointer-events:all;}
.card-header{padding:14px 16px 11px;display:flex;align-items:flex-start;gap:11px;}
.card-albumart{width:48px;height:48px;border-radius:9px;flex-shrink:0;object-fit:cover;background:rgba(255,255,255,0.05);}
.card-track{color:#fff;font-size:13px;font-weight:700;line-height:1.35;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-artist{color:rgba(255,255,255,0.4);font-size:11px;font-weight:300;}
.card-divider{height:1px;background:rgba(255,255,255,0.05);margin:0 16px;}
.card-moodbox{padding:10px 16px;}
.mood-label{color:rgba(255,255,255,0.25);font-size:10px;font-weight:500;letter-spacing:0.05em;margin-bottom:6px;}
.card-moods{display:flex;flex-wrap:wrap;gap:4px;}
.mood-tag{border-radius:20px;padding:3px 9px;font-size:10px;font-weight:500;}
.card-footer{padding:9px 16px 13px;display:flex;align-items:center;justify-content:space-between;}
.footer-loc{display:flex;align-items:center;gap:5px;}
.footer-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.footer-text{color:rgba(255,255,255,0.22);font-size:11px;}
.footer-ago{color:rgba(255,255,255,0.15);font-size:11px;}
.card-close{position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.06);border:none;
  border-radius:50%;width:24px;height:24px;color:rgba(255,255,255,0.35);
  cursor:pointer;font-size:14px;line-height:24px;text-align:center;font-family:inherit;}

/* 광고 빌보드 */
.ad-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,0.8));animation:bbFloat 3.5s ease-in-out infinite;}
@keyframes bbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bb-card{background:rgba(6,4,16,0.96);border-radius:12px;padding:8px 12px 8px 9px;
  display:flex;align-items:center;gap:8px;border:1px solid;position:relative;overflow:hidden;
  min-width:130px;white-space:nowrap;transition:transform 0.2s;}
.bb-card:hover{transform:scale(1.05);}
.bb-card::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent);
  animation:bbShine 3.5s ease-in-out infinite;}
@keyframes bbShine{0%,60%,100%{left:-60%}40%{left:130%}}
.bb-adtag{position:absolute;top:-8px;right:8px;
  background:linear-gradient(135deg,#c77dff,#7B68EE);
  border-radius:7px;padding:2px 7px;color:#fff;font-size:9px;font-weight:700;}
.bb-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.bb-name{color:#fff;font-size:11px;font-weight:700;margin-bottom:1px;}
.bb-sub{color:rgba(255,255,255,0.35);font-size:9px;}
.bb-line{width:2px;height:18px;}
.bb-anchor{width:7px;height:7px;border-radius:50%;margin-top:-1px;}

/* 광고 카드 */
#adcard{position:fixed;bottom:90px;right:16px;z-index:200;
  background:rgba(8,6,18,0.96);backdrop-filter:blur(30px);border-radius:18px;
  width:calc(100vw - 32px);max-width:280px;
  opacity:0;transform:translateY(10px) scale(0.97);
  transition:opacity 0.22s,transform 0.22s;pointer-events:none;overflow:hidden;}
#adcard.visible{opacity:1;transform:translateY(0) scale(1);pointer-events:all;}
.adc-hero{height:90px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;}
.adc-hero::after{content:"";position:absolute;bottom:0;left:0;right:0;height:35px;
  background:linear-gradient(to bottom,transparent,rgba(8,6,18,0.96));}
.adc-body{padding:10px 16px 16px;}
.adc-spon{display:inline-flex;align-items:center;gap:5px;
  background:rgba(199,125,255,0.1);border:1px solid rgba(199,125,255,0.22);
  border-radius:20px;padding:3px 9px;color:#c77dff;font-size:10px;font-weight:500;margin-bottom:8px;}
.adc-title{color:#fff;font-size:15px;font-weight:700;margin-bottom:4px;line-height:1.4;}
.adc-desc{color:rgba(255,255,255,0.38);font-size:11px;margin-bottom:12px;line-height:1.7;}
.adc-cta{display:block;width:100%;padding:11px;border-radius:11px;border:none;cursor:pointer;
  font-size:12px;font-weight:700;font-family:inherit;transition:transform 0.15s;}
.adc-cta:active{transform:scale(0.98);}
.adc-stats{display:flex;margin-top:10px;border-top:1px solid rgba(255,255,255,0.05);padding-top:10px;}
.stat-item{flex:1;text-align:center;}
.stat-num{color:#fff;font-size:13px;font-weight:700;}
.stat-label{color:rgba(255,255,255,0.22);font-size:10px;margin-top:2px;}
.adc-close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.35);border:none;
  border-radius:50%;width:26px;height:26px;color:rgba(255,255,255,0.55);
  cursor:pointer;font-size:15px;line-height:26px;text-align:center;font-family:inherit;}

/* 토스트 */
#toast{position:fixed;top:60px;left:50%;z-index:300;
  transform:translateX(-50%) translateY(-10px);
  background:rgba(8,6,18,0.92);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.07);border-radius:30px;padding:8px 16px;
  display:flex;align-items:center;gap:8px;white-space:nowrap;opacity:0;
  transition:opacity 0.25s,transform 0.25s;pointer-events:none;
  max-width:calc(100vw - 32px);overflow:hidden;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast-pill{background:rgba(199,125,255,0.15);border:1px solid rgba(199,125,255,0.3);
  border-radius:20px;padding:2px 8px;color:#c77dff;font-size:10px;font-weight:500;flex-shrink:0;}

/* 닉네임 모달 */
#nickOverlay{position:fixed;inset:0;z-index:2000;background:rgba(3,3,10,0.92);
  backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.3s;}
#nickOverlay.open{opacity:1;pointer-events:all;}
#nickBox{background:rgba(10,8,24,0.99);border:1px solid rgba(199,125,255,0.2);
  border-radius:24px;padding:32px 24px;width:calc(100vw - 48px);max-width:340px;text-align:center;}
.nick-emoji{font-size:48px;margin-bottom:16px;}
.nick-title{color:#fff;font-size:20px;font-weight:700;margin-bottom:8px;}
.nick-sub{color:rgba(255,255,255,0.35);font-size:13px;margin-bottom:24px;line-height:1.6;}
#nickInput{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(199,125,255,0.3);
  border-radius:12px;padding:13px 16px;color:#fff;font-size:16px;font-family:inherit;
  outline:none;text-align:center;margin-bottom:12px;}
#nickInput::placeholder{color:rgba(255,255,255,0.2);}
.nick-btn{width:100%;padding:14px;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#c77dff,#7B68EE);color:#fff;
  font-size:15px;font-weight:700;font-family:inherit;box-shadow:0 6px 20px #c77dff44;}

/* 공유 카드 */
#shareCardOverlay{position:fixed;inset:0;z-index:3000;background:rgba(3,3,10,0.95);
  backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity 0.3s;}
#shareCardOverlay.open{opacity:1;pointer-events:all;}
#shareCanvas{border-radius:16px;max-width:calc(100vw - 48px);box-shadow:0 20px 60px rgba(0,0,0,0.8);}
.share-card-btns{display:flex;gap:10px;}
.sc-btn{padding:12px 22px;border-radius:12px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;}
.sc-save{background:linear-gradient(135deg,#c77dff,#7B68EE);color:#fff;}
.sc-close{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);}

/* 마커 */
.noct-marker{position:relative;width:18px;height:18px;cursor:pointer;}
.noct-marker .m-ring{position:absolute;inset:-6px;border-radius:50%;border:1.5px solid;opacity:0;animation:ringOut 2.8s ease-out infinite;}
.noct-marker .m-ring2{position:absolute;inset:-2px;border-radius:50%;opacity:0.15;animation:glowBreath 2.8s ease-in-out infinite;}
.noct-marker .m-core{position:absolute;inset:3px;border-radius:50%;transition:transform 0.18s;}
.noct-marker .m-shine{position:absolute;inset:6px;border-radius:50%;background:rgba(255,255,255,0.85);}
.noct-marker:active .m-core{transform:scale(1.4);}
@keyframes ringOut{0%{transform:scale(0.6);opacity:0.8}100%{transform:scale(2.6);opacity:0}}
@keyframes glowBreath{0%,100%{opacity:0.15}50%{opacity:0.3}}

/* 내 마커 */
/* 내 마커 펄스 */
@keyframes myPulse{
  0%{box-shadow:0 0 0 0 rgba(199,125,255,0.9);}
  70%{box-shadow:0 0 0 20px rgba(199,125,255,0);}
  100%{box-shadow:0 0 0 0 rgba(199,125,255,0);}
}

/* 실시간 유저 닉네임 라벨 */

function getVibe() {
  var h = new Date().getHours();
  if (h >= 0 && h < 5) return {tag:"새벽 감성 🌙", color:"#a78bfa"};
  if (h >= 5 && h < 9) return {tag:"이른 아침 ☀️", color:"#fbbf24"};
  if (h >= 9 && h < 12) return {tag:"오전 에너지 ⚡", color:"#34d399"};
  if (h >= 12 && h < 15) return {tag:"점심 여유 🍜", color:"#60a5fa"};
  if (h >= 15 && h < 18) return {tag:"오후 감성 🌤️", color:"#fb923c"};
  if (h >= 18 && h < 21) return {tag:"저녁 퇴근길 🚇", color:"#f472b6"};
  return {tag:"야간 감성 🌃", color:"#c077ff"};
}

}

  for (var i = 0; i < layers.length; i++) {
    if (layers[i].type === 'symbol' && layers[i].layout['text-field']) {

    id: 'bld-normal', source: 'composite', 'source-layer': 'building',
    filter: ['==', 'extrude', 'true'], type: 'fill-extrusion', minzoom: 12,

    id: 'bld-top', source: 'composite', 'source-layer': 'building',
    filter: ['all', ['==', 'extrude', 'true'], ['>=', 'height', 20]],
    type: 'fill-extrusion', minzoom: 14,

// ── 마커 생성 ──
function spawnAdLayer(k) {
  var features = (ADS[k] || []).map(function(ad) {
    return {type: 'Feature', geometry: {type: 'Point', coordinates: [ad.lng, ad.lat]}, properties: {color: ad.color}};
  });
  if (map.getSource('ad-spots')) {
    map.getSource('ad-spots').setData({type: 'FeatureCollection', features: features});
  }
}

function spawnMarkers(k) {
  markers.forEach(function(m) { m.remove(); });
  markers.length = 0;
  CITIES[k].spots.forEach(function(spot) {
    var n = Math.floor(4 + Math.random() * 7);
    for (var i = 0; i < n; i++) {
      var s = FAKE_SONGS[Math.floor(Math.random() * FAKE_SONGS.length)];
      var lng = spot.lng + (Math.random() - 0.5) * 0.02;
      var lat = spot.lat + (Math.random() - 0.5) * 0.015;
      var el = document.createElement('div');
      el.className = 'noct-marker';
      el.innerHTML = '<div class="m-ring" style="border-color:' + s.color + ';animation-delay:' + (Math.random()*2) + 's"></div>'
        + '<div class="m-ring2" style="background:' + s.color + '"></div>'
        + '<div class="m-core" style="background:' + s.color + ';box-shadow:0 0 10px ' + s.color + '88"></div>'
        + '<div class="m-shine"></div>';
      (function(song, spotName) {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          closeAdCard();
          showFakeCard(song, spotName);
        });
      })(s, spot.name);
      markers.push(new mapboxgl.Marker({element: el, anchor: 'center'}).setLngLat([lng, lat]).addTo(map));
    }
  });
}

function spawnAdMarkers(k) {
  adMarkers.forEach(function(m) { m.remove(); });
  adMarkers.length = 0;
  (ADS[k] || []).forEach(function(ad) {
    var el = document.createElement('div');
    el.className = 'ad-wrap';
    el.innerHTML = '<div class="bb-card" style="border-color:' + ad.color + '55;box-shadow:0 0 24px ' + ad.color + '33">'
      + '<div class="bb-adtag">AD</div>'
      + '<div class="bb-ico" style="background:' + ad.color + '22;border:1px solid ' + ad.color + '44">' + ad.icon + '</div>'
      + '<div><div class="bb-name">' + ad.brand + '</div><div class="bb-sub">' + ad.tagline + '</div></div>'
      + '</div>'
      + '<div class="bb-line" style="background:linear-gradient(to bottom,' + ad.color + '99,transparent)"></div>'
      + '<div class="bb-anchor" style="background:' + ad.color + ';box-shadow:0 0 10px ' + ad.color + '"></div>';
    (function(adData) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        closeCard();
        showAdCard(adData);
      });
    })(ad);
    adMarkers.push(new mapboxgl.Marker({element: el, anchor: 'bottom', offset: [0, -4]}).setLngLat([ad.lng, ad.lat]).addTo(map));
  });
}

// ── 검색 ──
function openSearch() {
  document.getElementById('searchOverlay').classList.add('open');
  setTimeout(function() { document.getElementById('searchInput').focus(); }, 400);
}
function closeSearch() { document.getElementById('searchOverlay').classList.remove('open'); }
function handleOverlayClick(e) { if (e.target === document.getElementById('searchOverlay')) closeSearch(); }
function setSearch(q) {
  document.getElementById('searchInput').value = q;
  handleSearchInput();
  doSearch();
}
function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').style.display = 'none';
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('quickSection').style.display = 'block';
}
function handleSearchInput() {
  var v = document.getElementById('searchInput').value;
  document.getElementById('searchClear').style.display = v ? 'block' : 'none';
  document.getElementById('quickSection').style.display = v ? 'none' : 'block';
  clearTimeout(searchTimer);
  if (v.length > 1) searchTimer = setTimeout(doSearch, 500);
  else document.getElementById('searchResults').innerHTML = '';
}

async function doSearch() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  document.getElementById('quickSection').style.display = 'none';
  var res = document.getElementById('searchResults');
  res.innerHTML = '<div class="search-loading">🔍 검색 중...</div>';
  try {
    var url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&q='
      + encodeURIComponent(q + ' official audio')
      + '&type=video&videoCategoryId=10&maxResults=8&key=' + YT_KEY;
    var data = await fetch(url).then(function(r) { return r.json(); });
    if (!data.items || data.items.length === 0) {
      res.innerHTML = '<div class="search-loading">검색 결과가 없어요 😢</div>';
      return;
    }
    res.innerHTML = '';
    data.items.forEach(function(item) {
      var el = document.createElement('div');
      el.className = 'result-item';
      var thumb = item.snippet.thumbnails.default.url;
      el.innerHTML = '<img class="result-thumb" src="' + thumb + '" alt="">'
        + '<div class="result-info">'
        + '<div class="result-title">' + item.snippet.title + '</div>'
        + '<div class="result-channel">' + item.snippet.channelTitle + '</div>'
        + '</div>';
      el.addEventListener('click', function() {
        selectSong(item.id.videoId, item.snippet.title, item.snippet.channelTitle, thumb);
      });
      res.appendChild(el);
    });
  } catch (e) {
    res.innerHTML = '<div class="search-loading">검색 오류가 발생했어요 😢</div>';
  }
}

// ── GPS 위치 가져오기 ──
// GPS 추적
var gpsWatchId = null;
var gpsReady = false;

function startGPSTracking() {
  if (!navigator.geolocation) return;
  stopGPS();
  gpsReady = false;

  gpsWatchId = navigator.geolocation.watchPosition(
    function(pos) {
      var lng = pos.coords.longitude;
      var lat = pos.coords.latitude;
      var acc = Math.round(pos.coords.accuracy);

      myLng = lng;
      myLat = lat;

      // 마커 위치 이동
      if (myMarker) {
        myMarker.setLngLat([lng, lat]);
        if (!gpsReady) {
          // 첫 GPS 수신 시 지도 이동
          gpsReady = true;
          map.flyTo({center:[lng,lat], zoom:16, pitch:50, duration:1200});
        }
      }

      // 정확도 표시
      var accText = acc < 20 ? '🟢 GPS 정확' : acc < 100 ? '🟡 GPS 양호' : '🔴 GPS 잡는 중';
      if (currentSong) {
        document.getElementById('playerChannel').textContent = currentSong.channel + ' · ' + accText;
        upsertUser(lng, lat);
      }
    },
    function() { /* GPS 실패 무시 - 이미 마커 있음 */ },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0}
  );
}

function stopGPS() {
  if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }
  gpsReady = false;
}

// ── 공유 카드 ──
function generateShareCard() {
  if (!currentSong) return;
  var canvas = document.getElementById('shareCanvas');
  var ctx = canvas.getContext('2d');
  var W = 360, H = 560;
  canvas.width = W; canvas.height = H;

  var bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#03030a');
  bg.addColorStop(0.5, '#0a0520');
  bg.addColorStop(1, '#03030a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(100,80,200,0.06)';
  ctx.lineWidth = 0.5;
  for (var i = 0; i < 18; i++) {
    ctx.beginPath(); ctx.moveTo(0, i*H/18); ctx.lineTo(W, i*H/18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i*W/18, 0); ctx.lineTo(i*W/18, H); ctx.stroke();
  }

  ctx.fillStyle = 'rgba(199,125,255,0.12)';
  roundRectFill(ctx, 20, 28, 70, 26, 8);
  ctx.fillStyle = '#c77dff';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('noct', 55, 46);

  var artSize = 180, artX = (W-artSize)/2, artY = 80;
  var grd = ctx.createRadialGradient(W/2, artY+artSize/2, 10, W/2, artY+artSize/2, artSize);
  grd.addColorStop(0, 'rgba(199,125,255,0.25)');
  grd.addColorStop(1, 'rgba(199,125,255,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(artX-40, artY-40, artSize+80, artSize+80);

  ctx.fillStyle = 'rgba(199,125,255,0.15)';
  roundRectFill(ctx, artX, artY, artSize, artSize, 18);
  ctx.strokeStyle = 'rgba(199,125,255,0.3)';
  ctx.lineWidth = 1;
  roundRectStroke(ctx, artX, artY, artSize, artSize, 18);

  ctx.font = '56px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c77dff';
  ctx.fillText('🎵', W/2, artY + artSize/2 + 20);

  finishShareCard(ctx, W, H, artY, artSize);
}

function finishShareCard(ctx, W, H, artY, artSize) {
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  var t = currentSong.title.length > 22 ? currentSong.title.substring(0,22)+'...' : currentSong.title;
  ctx.fillText(t, W/2, artY + artSize + 40);
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.font = '14px sans-serif';
  ctx.fillText(currentSong.channel, W/2, artY + artSize + 62);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(40, artY+artSize+82); ctx.lineTo(W-40, artY+artSize+82); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.font = '12px sans-serif';
  var nick = myNick || '익명';
  var city = CITIES[currentCity].name;
  ctx.fillText(nick + ' · ' + city + ' · 지금 듣는 중', W/2, artY+artSize+106);
  ctx.fillStyle = 'rgba(199,125,255,0.1)';
  roundRectFill(ctx, W/2-90, H-58, 180, 38, 10);
  ctx.strokeStyle = 'rgba(199,125,255,0.22)';
  ctx.lineWidth = 1;
  roundRectStroke(ctx, W/2-90, H-58, 180, 38, 10);
  ctx.fillStyle = '#c77dff';
  ctx.font = 'bold 11px sans-serif';
  ctx.fillText('hepick01.github.io/noct', W/2, H-34);
  document.getElementById('shareCardOverlay').classList.add('open');
}

function roundRectFill(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath(); ctx.fill();
}
function roundRectStroke(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath(); ctx.stroke();
}

function downloadCard() {
  var canvas = document.getElementById('shareCanvas');
  var link = document.createElement('a');
  link.download = 'noct-' + (currentSong ? currentSong.title.substring(0,10) : 'share') + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('📥 이미지 저장됐어요!');
}
function closeShareCard() { document.getElementById('shareCardOverlay').classList.remove('open'); }

// ── Supabase 실시간 ──
var LIVE_COLORS = ["#a78bfa","#f87171","#34d399","#60a5fa","#fbbf24","#f472b6","#67e8f9","#fb923c"];

function getUserColor(nick) {
  return LIVE_COLORS[(nick.charCodeAt(0) || 0) % LIVE_COLORS.length];
}

function renderLiveUser(user) {
  if (user.id === myUserId) return;
  if (liveMarkers[user.id]) { liveMarkers[user.id].remove(); delete liveMarkers[user.id]; }
  var color = getUserColor(user.nick || '?');
  var el = document.createElement('div');
  el.className = 'noct-marker';
  el.innerHTML = '<div class="m-ring" style="border-color:' + color + ';animation-delay:' + (Math.random()*2) + 's"></div>'
    + '<div class="m-ring2" style="background:' + color + '"></div>'
    + '<div class="m-core" style="background:' + color + ';box-shadow:0 0 10px ' + color + '88"></div>'
    + '<div class="m-shine"></div>'
    + '<div class="live-nick" style="color:' + color + ';border-color:' + color + '44">' + (user.nick || '?') + '</div>';
  el.addEventListener('click', function(e) {
    e.stopPropagation();
    closeAdCard();
    document.getElementById('cardtrack').textContent = user.song_title || '음악 없음';
    document.getElementById('cardartist').textContent = user.song_channel || '';
    document.getElementById('cardfooter').textContent = (user.nick || '익명') + ' · ' + (user.city === 'busan' ? '부산' : '서울');
    document.getElementById('footerdot').style.background = color;
    if (user.song_thumb) { document.getElementById('cardcover').src = user.song_thumb; }
    else { document.getElementById('cardcover').src = ''; document.getElementById('cardcover').style.background = color + '22'; }
    document.getElementById('cardmoods').innerHTML =
      '<span class="mood-tag" style="background:' + color + '14;border:1px solid ' + color + '30;color:' + color + '">지금 듣는 중 🎵</span>';
    document.getElementById('songcard').classList.add('visible');
  });
  var marker = new mapboxgl.Marker({element: el, anchor: 'center'}).setLngLat([user.lng, user.lat]).addTo(map);
  liveMarkers[user.id] = marker;
}

function removeLiveUser(id) {
  if (liveMarkers[id]) { liveMarkers[id].remove(); delete liveMarkers[id]; }
}

async function loadLiveUsers() {
  if (!db) return;
  var fiveMinAgo = new Date(Date.now() - 5*60*1000).toISOString();
  var result = await db.from('live_users').select('*').gte('updated_at', fiveMinAgo);
  if (result.data) {
    Object.keys(liveMarkers).forEach(function(id) { liveMarkers[id].remove(); delete liveMarkers[id]; });
    result.data.forEach(function(user) { renderLiveUser(user); });
    var total = 183 + result.data.length;
    document.getElementById('livenum').textContent = total;
  }
}

function subscribeRealtime() {
  if (!db) return;
  db.channel('live-users')
    .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'live_users'}, function(p) {
      renderLiveUser(p.new);
      showToast('🎵 ' + p.new.nick + '님이 합류했어요!');
    })
    .on('postgres_changes', {event: 'UPDATE', schema: 'public', table: 'live_users'}, function(p) {
      renderLiveUser(p.new);
    })
    .on('postgres_changes', {event: 'DELETE', schema: 'public', table: 'live_users'}, function(p) {
      removeLiveUser(p.old.id);
    })
    .subscribe();
}

async function upsertUser(lng, lat) {
  if (!db || !myNick || !currentSong) return;
  if (!myUserId) {
    var ins = await db.from('live_users').insert({
      nick: myNick,
      song_title: currentSong.title,
      song_channel: currentSong.channel,
      song_thumb: currentSong.thumb || '',
      video_id: currentSong.videoId,
      lat: lat, lng: lng, city: currentCity,
    }).select().single();
    if (ins.data) {
      myUserId = ins.data.id;
      localStorage.setItem('noct_uid', myUserId);
    }
  } else {
    await db.from('live_users').update({
      nick: myNick,
      song_title: currentSong.title,
      song_channel: currentSong.channel,
      song_thumb: currentSong.thumb || '',
      video_id: currentSong.videoId,
      lat: lat, lng: lng, city: currentCity,
      updated_at: new Date().toISOString(),
    }).eq('id', myUserId);
  }
}

// 종료 시 삭제
window.addEventListener('beforeunload', function() {
  if (myUserId && db) {
    db.from('live_users').delete().eq('id', myUserId);
  }
});

}, 12000);
</script>
